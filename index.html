<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MSME Navigator</title>
    <meta name="description" content="Tell us what's happening in your business. We'll help you discover support routes that may be relevant, and show you what to do next. No scheme names needed." />
    <meta name="theme-color" content="#123B3A" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="#/">MSME <i>Navigator</i></a>
        <nav class="nav" aria-label="Main">
          <a class="pill help" id="navHelp" href="#/help" data-i18n="nav.help">Help &amp; grievance</a>
          <a class="pill" id="navMy" href="#/my-msme" data-i18n="nav.my">My journey</a>
          <a class="pill" id="navFunding" href="#/funding" data-i18n="nav.funding" hidden>Funding</a>
          <button class="pill lang" id="langBtn" data-act="lang" lang="hi">हिंदी</button>
        </nav>
      </header>
      <ol class="journey" id="journey" aria-label="Your progress"></ol>
      <main id="view" tabindex="-1"></main>
      <footer class="foot">
        <div class="row">
          <span class="pill" id="aiPill">Checking…</span>
          <button class="pill" data-act="about" data-i18n="nav.about">About the data</button>
          <button class="pill" id="expertBtn" data-act="expert" aria-pressed="false" data-i18n="nav.expert">Expert view</button>
        </div>
        <p data-i18n="foot">Prototype · controlled corpus recorded Sep 2026 · records are not live-verified · decision support, not approval.</p>
      </footer>
    </div>
    <div class="modal" id="modal" hidden><div class="mbox" id="modalBody" role="dialog" aria-modal="true"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
